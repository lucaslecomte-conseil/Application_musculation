<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach de Poche">
<meta name="theme-color" content="#0a0a0a">
<title>Coach de Poche</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0a; --bg2:#141414; --bg3:#1e1e1e; --bg4:#282828;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
  --text:#f0f0f0; --text2:#888; --text3:#555;
  --accent:#c8f135; --accent-dim:rgba(200,241,53,0.12); --accent-text:#0a0a0a;
  --radius:14px; --radius-sm:8px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;position:fixed;width:100%;height:100%}
.screen{display:none;flex-direction:column;height:100%;position:absolute;inset:0;overflow:hidden}
.screen.active{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 16px) 20px 14px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-center{text-align:center;flex:1}
.topbar-title{font-size:16px;font-weight:600;letter-spacing:-0.02em}
.topbar-sub{font-size:12px;color:var(--text2);margin-top:1px;font-family:'DM Mono',monospace}
.icon-btn{width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--text);flex-shrink:0}
.icon-btn:active{background:var(--bg3);transform:scale(0.96)}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px}
.bottombar{padding:12px 20px calc(var(--safe-bottom) + 16px);border-top:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.btn-primary{width:100%;padding:16px;background:var(--accent);color:var(--accent-text);border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-primary:active{opacity:0.85;transform:scale(0.99)}
.btn-ghost{width:100%;padding:13px;background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius);font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px}
.btn-ghost:active{color:var(--text);background:var(--bg2)}
.home-hero{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;cursor:pointer;position:relative;overflow:hidden}
.home-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--accent-dim) 0%,transparent 60%);pointer-events:none}
.home-hero:active{border-color:var(--accent)}
.hero-label{font-size:11px;font-weight:600;letter-spacing:0.08em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.hero-title{font-size:22px;font-weight:600;letter-spacing:-0.03em;margin-bottom:4px}
.hero-sub{font-size:13px;color:var(--text2)}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.08em;color:var(--text3);text-transform:uppercase;margin-bottom:10px;margin-top:4px}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer}
.history-item:last-child{border-bottom:none}
.history-item:active{opacity:0.6}
.hist-name{font-size:15px;font-weight:500;letter-spacing:-0.01em;margin-bottom:3px}
.hist-meta{font-size:12px;color:var(--text2);font-family:'DM Mono',monospace}
.hist-arrow{color:var(--text3);font-size:20px}
.empty-state{text-align:center;padding:40px 0;color:var(--text2);font-size:14px}
.empty-icon{font-size:32px;margin-bottom:12px}
.rest-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px}
.rest-label{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:0.06em;text-transform:uppercase}
.rest-val{font-size:22px;font-weight:500;font-family:'DM Mono',monospace;color:var(--text)}
.rest-val.running{color:var(--accent)}
.rest-action{font-size:13px;font-weight:500;color:var(--accent);background:var(--accent-dim);border:1px solid rgba(200,241,53,0.2);padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer}
.rest-action:active{background:rgba(200,241,53,0.25)}
.exo-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.exo-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer}
.exo-name{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.exo-muscle{font-size:12px;color:var(--text2);margin-top:2px}
.exo-badge{font-size:11px;font-weight:600;background:var(--bg3);color:var(--text2);padding:4px 10px;border-radius:99px;flex-shrink:0}
.exo-body{border-top:1px solid var(--border)}
.series-header{display:grid;grid-template-columns:24px 1fr 1fr 36px 28px;gap:6px;padding:8px 16px;font-size:11px;color:var(--text3);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;align-items:center}
.serie-row{display:grid;grid-template-columns:24px 1fr 1fr 36px 28px;gap:6px;padding:8px 16px;align-items:center;border-top:1px solid var(--border)}
.serie-row.done-row{background:rgba(200,241,53,0.04)}
.serie-num{font-size:13px;color:var(--text3);font-family:'DM Mono',monospace;text-align:center}
.serie-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 6px;font-size:15px;text-align:center;color:var(--text);font-family:'DM Mono',monospace;width:100%}
.serie-input:focus{outline:none;border-color:var(--border2)}
.serie-check{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.serie-check.done{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.serie-check:active{transform:scale(0.92)}
.add-serie{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;font-size:13px;color:var(--text2);border-top:1px solid var(--border)}
.add-serie:active{color:var(--text)}
.add-circle{width:22px;height:22px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:16px}
.unit-btn{font-size:10px;background:var(--bg4);padding:2px 8px;border-radius:99px;color:var(--text2);border:1px solid var(--border2);cursor:pointer;margin-left:6px;vertical-align:middle}
.del-serie{width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid rgba(255,90,90,0.2);background:rgba(255,90,90,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:#ff5a5a;flex-shrink:0}
.del-serie:active{background:rgba(255,90,90,0.18)}
.exo-options-row{display:flex;align-items:center;gap:6px;padding:8px 16px 10px;border-top:1px solid var(--border);flex-wrap:wrap}
.exo-opt-btn{font-size:12px;padding:5px 10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer}
.exo-opt-btn:active{background:var(--bg4)}
.exo-opt-btn.active-ss{color:#64a0ff;border-color:rgba(100,160,255,0.35);background:rgba(100,160,255,0.1)}
.exo-opt-btn.active-ds{color:#ff8c00;border-color:rgba(255,140,0,0.35);background:rgba(255,140,0,0.1)}
.exo-opt-btn.active-ms{color:var(--accent);border-color:rgba(200,241,53,0.35);background:var(--accent-dim)}
.exo-opt-btn.danger{color:#ff5a5a;border-color:rgba(255,90,90,0.2);background:rgba(255,90,90,0.06)}
.ss-bridge{font-size:11px;font-weight:600;color:#64a0ff;padding:0 20px 8px;display:flex;align-items:center;gap:6px}
.ss-bridge::before{content:'';width:2px;height:14px;background:#64a0ff;border-radius:1px;margin-left:4px;flex-shrink:0}
.cardio-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px 16px}
.cardio-lbl{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px}
.cardio-done{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border-top:1px solid var(--border);cursor:pointer;font-size:13px;color:var(--text2)}
.add-exo-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:1px dashed var(--border2);border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--text2);margin-bottom:12px}
.add-exo-row:active{background:var(--bg2)}
.modal-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);align-items:flex-end}
.modal-overlay.open{display:flex}
.modal-sheet{width:100%;background:var(--bg2);border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:0 0 calc(var(--safe-bottom) + 20px);max-height:78vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:12px auto 16px}
.modal-title{font-size:16px;font-weight:600;padding:0 20px 14px;border-bottom:1px solid var(--border)}
.modal-input{width:calc(100% - 40px);margin:14px 20px 0;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;font-size:15px;color:var(--text);font-family:'DM Sans',sans-serif}
.modal-input:focus{outline:none;border-color:rgba(200,241,53,0.4)}
.exo-section-hdr{font-size:10px;font-weight:600;letter-spacing:0.08em;color:var(--text3);text-transform:uppercase;padding:12px 20px 4px}
.exo-opt{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;cursor:pointer}
.exo-opt:active{background:var(--bg3)}
.exo-opt-name{font-size:15px;font-weight:500}
.exo-opt-tag{font-size:12px;color:var(--text2);background:var(--bg3);padding:3px 8px;border-radius:99px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 10px;text-align:center}
.stat-val{font-size:20px;font-weight:600;font-family:'DM Mono',monospace}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:3px}
.recap-exo{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.recap-exo-name{font-size:14px;font-weight:600;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-family:'DM Mono',monospace;background:var(--bg3);color:var(--text2);padding:5px 10px;border-radius:99px;border:1px solid var(--border)}
.pill.pr{background:var(--accent-dim);color:var(--accent);border-color:rgba(200,241,53,0.25)}
.photo-zone{border:1px dashed var(--border2);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;margin-bottom:14px}
.photos-preview{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.photo-thumb{width:80px;height:80px;border-radius:var(--radius-sm);object-fit:cover;border:1px solid var(--border)}
.note-lbl{font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:500}
.note-field{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:14px;color:var(--text);font-family:'DM Sans',sans-serif;resize:none;min-height:90px;line-height:1.5;margin-bottom:14px}
.note-field:focus{outline:none;border-color:var(--border2)}
#photo-input{display:none}
</style>
</head>
<body>

<!-- ═══ HOME ═══ -->
<div id="s-home" class="screen active">
  <div class="topbar">
    <div style="width:38px"></div>
    <div class="topbar-center">
      <div class="topbar-title">Coach de Poche</div>
      <div class="topbar-sub" id="home-date"></div>
    </div>
    <div class="icon-btn" onclick="alert('Graphiques en Phase 3 !')">📊</div>
  </div>
  <div class="content">
    <div class="home-hero" onclick="startNewSession()">
      <div class="hero-label">Aujourd'hui</div>
      <div class="hero-title">Nouvelle séance</div>
      <div class="hero-sub">Commencer l'entraînement →</div>
    </div>
    <div class="section-label">Historique</div>
    <div id="history-list"></div>
  </div>
</div>

<!-- ═══ SEANCE ═══ -->
<div id="s-seance" class="screen">
  <div class="topbar">
    <div class="icon-btn" onclick="confirmQuit()">✕</div>
    <div class="topbar-center">
      <div class="topbar-title">Séance en cours</div>
      <div class="topbar-sub" id="session-clock">00:00</div>
    </div>
    <div class="icon-btn" style="font-size:13px;font-weight:600" onclick="finishSession()">Fin</div>
  </div>
  <div class="content">
    <div class="rest-bar">
      <div>
        <div class="rest-label">Repos</div>
        <div class="rest-val" id="rest-display">—</div>
      </div>
      <div class="rest-action" id="rest-btn" onclick="toggleRest()">Démarrer</div>
    </div>
    <div id="exo-list"></div>
    <div class="add-exo-row" onclick="openModal()">
      <span style="font-size:20px">＋</span><span>Ajouter un exercice</span>
    </div>
  </div>
  <div class="bottombar">
    <button class="btn-primary" onclick="finishSession()">Terminer la séance</button>
  </div>
</div>

<!-- ═══ RECAP ═══ -->
<div id="s-recap" class="screen">
  <div class="topbar">
    <div class="icon-btn" onclick="goTo('s-seance')">‹</div>
    <div class="topbar-center">
      <div class="topbar-title">Récapitulatif</div>
      <div class="topbar-sub" id="recap-date"></div>
    </div>
    <div style="width:38px"></div>
  </div>
  <div class="content">
    <div class="stats-grid" id="recap-stats"></div>
    <div id="recap-exos"></div>
    <div id="photos-preview" class="photos-preview"></div>
    <div class="photo-zone" onclick="document.getElementById('photo-input').click()">
      <div style="font-size:28px;margin-bottom:8px">📷</div>
      <div style="font-size:14px;color:var(--text2)">Ajouter une photo</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px">Post-séance · Optionnel</div>
    </div>
    <input type="file" id="photo-input" accept="image/*" multiple onchange="handlePhotos(this)">
    <div class="note-lbl">Notes de séance</div>
    <textarea class="note-field" id="recap-notes" placeholder="Sensations, douleurs, PRs..."></textarea>
  </div>
  <div class="bottombar">
    <button class="btn-primary" onclick="saveSession()">Enregistrer la séance</button>
    <button class="btn-ghost" onclick="goTo('s-seance')">← Retourner à la séance</button>
  </div>
</div>

<!-- ═══ DETAIL ═══ -->
<div id="s-detail" class="screen">
  <div class="topbar">
    <div class="icon-btn" onclick="goTo('s-home')">‹</div>
    <div class="topbar-center">
      <div class="topbar-title" id="detail-title">Séance</div>
      <div class="topbar-sub" id="detail-date"></div>
    </div>
    <div class="icon-btn" onclick="deleteSession()">🗑</div>
  </div>
  <div class="content" id="detail-content"></div>
</div>

<!-- ═══ MODAL ═══ -->
<div class="modal-overlay" id="exo-modal" onclick="closeModalOutside(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Choisir un exercice</div>
    <input class="modal-input" type="text" id="exo-search" placeholder="Rechercher..." oninput="filterExos(this.value)">
    <div id="exo-options"></div>
  </div>
</div>

<script>
// ── DB ──
let db;
function initDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('CoachDePoche', 1);
    r.onupgradeneeded = e => {
      if (!e.target.result.objectStoreNames.contains('sessions'))
        e.target.result.createObjectStore('sessions', { keyPath: 'id' });
    };
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
const dbPut = d => new Promise((res,rej) => { const tx=db.transaction('sessions','readwrite'); tx.objectStore('sessions').put(d).onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); });
const dbAll = () => new Promise((res,rej) => { const tx=db.transaction('sessions','readonly'); const r=tx.objectStore('sessions').getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const dbDel = k => new Promise((res,rej) => { const tx=db.transaction('sessions','readwrite'); tx.objectStore('sessions').delete(k).onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); });

// ── STATE ──
let CS = null; // current session
let sTI = null, rTI = null, rStart = null, rRun = false;
let sPhotos = [];
let viewId = null;

// ── EXO DB ──
const EXOS = [
  {name:'Tapis de course',muscle:'Cardio',tool:'Cardio',type:'cardio'},
  {name:'Vélo elliptique',muscle:'Cardio',tool:'Cardio',type:'cardio'},
  {name:'Vélo stationnaire',muscle:'Cardio',tool:'Cardio',type:'cardio'},
  {name:'Rameur',muscle:'Cardio',tool:'Cardio',type:'cardio'},
  {name:'Stairmaster',muscle:'Cardio',tool:'Cardio',type:'cardio'},
  {name:'Bench Press',muscle:'Pectoraux',tool:'Barre'},
  {name:'Développé couché',muscle:'Pectoraux',tool:'Barre'},
  {name:'Incline DB Press',muscle:'Pectoraux',tool:'Haltères'},
  {name:'Chest Press Machine',muscle:'Pectoraux',tool:'Machine'},
  {name:'Chest Fly Machine',muscle:'Pectoraux',tool:'Machine'},
  {name:'DB Pullover',muscle:'Pectoraux',tool:'Haltères'},
  {name:'Shoulder Press',muscle:'Épaules',tool:'Haltères'},
  {name:'Développé militaire',muscle:'Épaules',tool:'Barre'},
  {name:'Lateral Raise',muscle:'Épaules',tool:'Haltères'},
  {name:'Front Raise',muscle:'Épaules',tool:'Haltères'},
  {name:'Rear Delt Fly',muscle:'Épaules',tool:'Haltères'},
  {name:'Face Pull',muscle:'Épaules',tool:'Poulie'},
  {name:'Lat Pulldown',muscle:'Dos',tool:'Poulie'},
  {name:'Lat Pulldown (Face Away)',muscle:'Dos',tool:'Poulie'},
  {name:'Scapular Pulldown',muscle:'Dos',tool:'Poulie'},
  {name:'Seated Row Machine',muscle:'Dos',tool:'Machine'},
  {name:'DB Row Bilatéral',muscle:'Dos',tool:'Haltères'},
  {name:'Rowing barre',muscle:'Dos',tool:'Barre'},
  {name:'Face Away Cable Pullover',muscle:'Dos',tool:'Poulie'},
  {name:'Straight Arm Pulldown',muscle:'Dos',tool:'Poulie'},
  {name:'Traction',muscle:'Dos',tool:'Poids corps'},
  {name:'Back Extension',muscle:'Dos',tool:'Machine'},
  {name:'Curl Câble',muscle:'Biceps',tool:'Poulie'},
  {name:'Curl Machine',muscle:'Biceps',tool:'Machine'},
  {name:'Curl barre',muscle:'Biceps',tool:'Barre'},
  {name:'Incline DB Curl',muscle:'Biceps',tool:'Haltères'},
  {name:'Hammer Curl',muscle:'Biceps',tool:'Haltères'},
  {name:'Triceps Pushdown Corde',muscle:'Triceps',tool:'Poulie'},
  {name:'Skull Crusher EZ',muscle:'Triceps',tool:'Barre EZ'},
  {name:'Seated Triceps Machine',muscle:'Triceps',tool:'Machine'},
  {name:'Dips',muscle:'Triceps',tool:'Poids corps'},
  {name:'Dips Assistés',muscle:'Triceps',tool:'Machine'},
  {name:'Squat barre',muscle:'Quadriceps',tool:'Barre'},
  {name:'Presse à cuisses',muscle:'Quadriceps',tool:'Machine'},
  {name:'Fentes marchées',muscle:'Quadriceps',tool:'Haltères'},
  {name:'Leg curl',muscle:'Ischiojambiers',tool:'Machine'},
  {name:'Soulevé de terre',muscle:'Dos/Ischio',tool:'Barre'},
  {name:'Hip thrust',muscle:'Fessiers',tool:'Barre'},
  {name:'Mollets debout',muscle:'Mollets',tool:'Machine'},
  {name:'Cable Crunch',muscle:'Abdominaux',tool:'Poulie'},
  {name:'Crunch Machine',muscle:'Abdominaux',tool:'Machine'},
  {name:'Pallof Press',muscle:'Abdominaux',tool:'Poulie'},
  {name:'Cable Side Bend',muscle:'Abdominaux',tool:'Poulie'},
  {name:'Gainage',muscle:'Abdominaux',tool:'Poids corps'},
  {name:'Reverse Curl',muscle:'Avant-bras',tool:'Haltères'},
  {name:'Wrist Curl',muscle:'Avant-bras',tool:'Haltères'},
];

// ── UTILS ──
const pad = n => n<10?'0'+n:''+n;
const uuid = () => Date.now().toString(36)+Math.random().toString(36).slice(2);
const fmtDate = ts => new Date(ts).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long'});
const fmtDur = s => { const m=Math.floor(s/60),r=s%60; return m+'min'+(r>0?' '+r+'s':''); };
const calcVol = exos => exos.reduce((t,ex)=>ex.type==='cardio'?t:t+ex.series.reduce((s,sr)=>s+(parseFloat(sr.charge)||0)*(parseInt(sr.reps)||0),0),0);

// ── NAV ──
function goTo(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

// ── HOME ──
async function loadHome() {
  document.getElementById('home-date').textContent = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const sessions = (await dbAll()).sort((a,b)=>b.startTime-a.startTime);
  const list = document.getElementById('history-list');
  if (!sessions.length) { list.innerHTML='<div class="empty-state"><div class="empty-icon">🏋️</div><div>Aucune séance</div><div style="margin-top:6px;font-size:12px">Lance ta première séance !</div></div>'; return; }
  list.innerHTML = sessions.map(s=>`<div class="history-item" onclick="viewSession('${s.id}')">
    <div><div class="hist-name">${s.name||'Séance'}</div>
    <div class="hist-meta">${fmtDate(s.startTime)} · ${s.duration?fmtDur(s.duration):'—'} · ${Math.round(calcVol(s.exercices))||'—'} kg</div></div>
    <div class="hist-arrow">›</div></div>`).join('');
}

// ── SESSION ──
function startNewSession() {
  CS = { id:uuid(), startTime:Date.now(), name:'', exercices:[], duration:0, photos:[], notes:'' };
  sPhotos = [];
  document.getElementById('exo-list').innerHTML = '';
  goTo('s-seance');
  clearInterval(sTI);
  sTI = setInterval(()=>{ const el=document.getElementById('session-clock'); if(el){const s=Math.floor((Date.now()-CS.startTime)/1000);el.textContent=pad(Math.floor(s/60))+':'+pad(s%60);} },1000);
}

function confirmQuit() {
  if (confirm('Abandonner la séance ?')) { clearInterval(sTI); clearInterval(rTI); goTo('s-home'); }
}

// ── REST ──
function toggleRest() {
  if (rRun) { clearInterval(rTI); rRun=false; document.getElementById('rest-display').textContent='—'; document.getElementById('rest-display').classList.remove('running'); document.getElementById('rest-btn').textContent='Démarrer'; }
  else startRest();
}
function startRest() {
  clearInterval(rTI); rRun=true; rStart=Date.now();
  document.getElementById('rest-btn').textContent='Arrêter';
  document.getElementById('rest-display').classList.add('running');
  rTI = setInterval(()=>{ const el=document.getElementById('rest-display'); if(el){const s=Math.floor((Date.now()-rStart)/1000);el.textContent=pad(Math.floor(s/60))+':'+pad(s%60);} },500);
}

// ── MODAL ──
function openModal() { document.getElementById('exo-search').value=''; filterExos(''); document.getElementById('exo-modal').classList.add('open'); setTimeout(()=>document.getElementById('exo-search').focus(),200); }
function closeModalOutside(e) { if(e.target===document.getElementById('exo-modal')) document.getElementById('exo-modal').classList.remove('open'); }

function filterExos(q) {
  const low = q.toLowerCase();
  const list = EXOS.filter(e=>e.name.toLowerCase().includes(low)||e.muscle.toLowerCase().includes(low));
  // group by muscle
  const grp = {};
  list.forEach((e,_)=>{ if(!grp[e.muscle])grp[e.muscle]=[]; grp[e.muscle].push(e); });
  let html='';
  Object.keys(grp).forEach(m=>{
    html+=`<div class="exo-section-hdr">${m}</div>`;
    grp[m].forEach(e=>{
      const i = EXOS.indexOf(e);
      html+=`<div class="exo-opt" onclick="selectExo(${i})"><div class="exo-opt-name">${e.name}</div><div class="exo-opt-tag">${e.tool}</div></div>`;
    });
  });
  if (q && !list.length) html=`<div class="exo-opt" onclick="addCustom()"><div class="exo-opt-name">＋ Ajouter "${q}"</div><div class="exo-opt-tag">Personnalisé</div></div>`;
  document.getElementById('exo-options').innerHTML = html;
}

function selectExo(i) {
  const e = EXOS[i];
  if (!e) return;
  const isC = e.type==='cardio';
  CS.exercices.push({ id:uuid(), name:e.name, muscle:e.muscle, tool:e.tool, type:isC?'cardio':'strength',
    series: isC ? [{duree:'',vitesse:'',inclinaison:'',done:false}] : [{charge:'',unit:'kg',reps:'',done:false}] });
  document.getElementById('exo-modal').classList.remove('open');
  renderExos();
}

function addCustom() {
  const n = document.getElementById('exo-search').value; if (!n) return;
  CS.exercices.push({ id:uuid(), name:n, muscle:'Personnalisé', tool:'—', type:'strength', series:[{charge:'',unit:'kg',reps:'',done:false}] });
  document.getElementById('exo-modal').classList.remove('open');
  renderExos();
}

// ── RENDER ──
function renderExos() {
  if (!CS) return;
  document.getElementById('exo-list').innerHTML = CS.exercices.map((exo,ei)=>{
    const isC = exo.type==='cardio';
    const badge = isC ? (exo.series[0]?.duree ? exo.series[0].duree+' min':'Cardio') : exo.series.length+' série'+(exo.series.length>1?'s':'');
    const tag = exo.tag || null;

    // superset bridge shown BEFORE this card if previous exo links to this one
    const prevExo = ei > 0 ? CS.exercices[ei-1] : null;
    const bridgeHtml = (prevExo?.tag==='superset') ?
      `<div class="ss-bridge">⚡ Superset avec ${prevExo.name}</div>` :
      (prevExo?.tag==='dropset') ?
      `<div class="ss-bridge" style="color:#ff8c00">🔥 Drop set de ${prevExo.name}</div>` : '';

    let body='';
    if (isC) {
      const s=exo.series[0]||{};
      body=`<div class="cardio-grid">
        <div><div class="cardio-lbl">Durée min</div><input class="serie-input" type="number" inputmode="numeric" value="${s.duree||''}" placeholder="35" onchange="updC(${ei},'duree',this.value)"></div>
        <div><div class="cardio-lbl">Vitesse km/h</div><input class="serie-input" type="number" inputmode="decimal" step="0.5" value="${s.vitesse||''}" placeholder="4" onchange="updC(${ei},'vitesse',this.value)"></div>
        <div><div class="cardio-lbl">Inclin %</div><input class="serie-input" type="number" inputmode="numeric" value="${s.inclinaison||''}" placeholder="10" onchange="updC(${ei},'inclinaison',this.value)"></div>
      </div>
      <div class="cardio-done" onclick="togC(${ei})">
        <div class="serie-check${s.done?' done':''}">${s.done?'✓':''}</div>
        <span>${s.done?'Terminé ✓':'Marquer comme terminé'}</span>
      </div>`;
    } else {
      const unit=exo.series[0]?.unit||'kg';
      body=`<div class="series-header"><span></span><span>Charge <span class="unit-btn" onclick="togUnit(${ei})">${unit}</span></span><span>Reps</span><span></span><span></span></div>
      ${exo.series.map((s,si)=>`<div class="serie-row${s.done?' done-row':''}">
        <span class="serie-num">${si+1}</span>
        <input class="serie-input" type="number" inputmode="decimal" step="0.5" value="${s.charge}" placeholder="—" onchange="updS(${ei},${si},'charge',this.value)">
        <input class="serie-input" type="number" inputmode="numeric" step="1" value="${s.reps}" placeholder="—" onchange="updS(${ei},${si},'reps',this.value)">
        <div class="serie-check${s.done?' done':''}" onclick="togS(${ei},${si})">${s.done?'✓':''}</div>
        <div class="del-serie" onclick="delSerie(${ei},${si})">✕</div>
      </div>`).join('')}
      <div class="add-serie" onclick="addSerie(${ei})"><div class="add-circle">＋</div> Ajouter une série</div>`;
    }

    // Options row: tag buttons + delete exo
    const optRow = `<div class="exo-options-row">
      <span class="exo-opt-btn${tag==='superset'?' active-ss':''}" onclick="togTag(${ei},'superset')">⚡ Superset</span>
      <span class="exo-opt-btn${tag==='dropset'?' active-ds':''}" onclick="togTag(${ei},'dropset')">🔥 Dropset</span>
      <span class="exo-opt-btn${tag==='myset'?' active-ms':''}" onclick="togTag(${ei},'myset')">💪 Myoset</span>
      <span class="exo-opt-btn danger" onclick="delExo(${ei})">🗑 Supprimer</span>
    </div>`;

    return `${bridgeHtml}<div class="exo-card">
      <div class="exo-header" onclick="togBody(${ei})">
        <div><div class="exo-name">${isC?'🏃 ':''}${exo.name}${tag==='superset'?' <span style="font-size:10px;color:#64a0ff">⚡SS</span>':tag==='dropset'?' <span style="font-size:10px;color:#ff8c00">🔥DS</span>':''}</div><div class="exo-muscle">${exo.muscle} · ${exo.tool}</div></div>
        <span class="exo-badge" id="bdg${ei}">${badge}</span>
      </div>
      <div class="exo-body" id="bdy${ei}">${body}${optRow}</div>
    </div>`;
  }).join('');
}

function togBody(ei) { const b=document.getElementById('bdy'+ei); if(b) b.style.display=b.style.display==='none'?'':'none'; }
function updS(ei,si,f,v) { if(CS?.exercices[ei]) CS.exercices[ei].series[si][f]=v; }
function updC(ei,f,v) {
  if(!CS?.exercices[ei]) return;
  CS.exercices[ei].series[0][f]=v;
  if(f==='duree'){const b=document.getElementById('bdg'+ei);if(b&&v)b.textContent=v+' min';}
}
function togS(ei,si) { if(!CS?.exercices[ei])return; CS.exercices[ei].series[si].done=!CS.exercices[ei].series[si].done; if(CS.exercices[ei].series[si].done)startRest(); renderExos(); }
function togC(ei) { if(!CS?.exercices[ei])return; CS.exercices[ei].series[0].done=!CS.exercices[ei].series[0].done; renderExos(); }
function togUnit(ei) { if(!CS?.exercices[ei])return; const cur=CS.exercices[ei].series[0]?.unit||'kg'; CS.exercices[ei].series.forEach(s=>s.unit=cur==='kg'?'lbs':'kg'); renderExos(); }
function addSerie(ei) { if(!CS?.exercices[ei])return; const l=CS.exercices[ei].series.slice(-1)[0]||{charge:'',reps:'',unit:'kg'}; CS.exercices[ei].series.push({charge:l.charge,reps:l.reps,unit:l.unit||'kg',done:false}); renderExos(); }
function delSerie(ei,si) { if(!CS?.exercices[ei])return; if(CS.exercices[ei].series.length<=1){alert('Minimum 1 série');return;} CS.exercices[ei].series.splice(si,1); renderExos(); }
function delExo(ei) { if(!CS?.exercices[ei])return; if(confirm('Supprimer cet exercice ?')){ CS.exercices.splice(ei,1); renderExos(); } }
function togTag(ei,tag) { if(!CS?.exercices[ei])return; CS.exercices[ei].tag = CS.exercices[ei].tag===tag ? null : tag; renderExos(); }

// ── FINISH ──
function finishSession() {
  const elapsed=Math.floor((Date.now()-CS.startTime)/1000);
  CS.duration=elapsed; clearInterval(sTI); clearInterval(rTI); rRun=false;
  const muscles=[...new Set(CS.exercices.filter(e=>e.type!=='cardio').map(e=>e.muscle))];
  const hasC=CS.exercices.some(e=>e.type==='cardio');
  CS.name=(hasC?'🏃 ':'')+( muscles.slice(0,2).join(' / ')||'Séance');
  document.getElementById('recap-date').textContent=fmtDate(CS.startTime);
  document.getElementById('recap-notes').value='';
  sPhotos=[]; document.getElementById('photos-preview').innerHTML='';
  const vol=Math.round(calcVol(CS.exercices));
  const ser=CS.exercices.filter(e=>e.type!=='cardio').reduce((t,e)=>t+e.series.length,0);
  document.getElementById('recap-stats').innerHTML=`
    <div class="stat-card"><div class="stat-val">${fmtDur(elapsed)}</div><div class="stat-lbl">Durée</div></div>
    <div class="stat-card"><div class="stat-val">${vol||'—'}</div><div class="stat-lbl">kg vol.</div></div>
    <div class="stat-card"><div class="stat-val">${ser}</div><div class="stat-lbl">Séries</div></div>`;
  document.getElementById('recap-exos').innerHTML=CS.exercices.map(buildRecap).join('');
  goTo('s-recap');
}

function buildRecap(exo) {
  if (exo.type==='cardio') {
    const s=exo.series[0]||{};
    return `<div class="recap-exo"><div class="recap-exo-name">🏃 ${exo.name}</div><div class="pills">
      ${s.duree?`<div class="pill">${s.duree} min</div>`:''}
      ${s.vitesse?`<div class="pill">${s.vitesse} km/h</div>`:''}
      ${s.inclinaison?`<div class="pill">${s.inclinaison}% inclin.</div>`:''}
    </div></div>`;
  }
  const max=Math.max(...exo.series.map(s=>parseFloat(s.charge)||0));
  const unit=exo.series[0]?.unit||'kg';
  const tagLabel = exo.tag==='superset'?' <span style="font-size:11px;color:#64a0ff">⚡ Superset</span>':exo.tag==='dropset'?' <span style="font-size:11px;color:#ff8c00">🔥 Dropset</span>':exo.tag==='myset'?' <span style="font-size:11px;color:var(--accent)">💪 Myoset</span>':'';
  return `<div class="recap-exo"><div class="recap-exo-name">${exo.name}${tagLabel}</div><div class="pills">
    ${exo.series.map(s=>{ const pr=parseFloat(s.charge)===max&&max>0; return `<div class="pill${pr?' pr':''}">${s.charge||'—'}${unit} × ${s.reps||'—'}${pr?' PR':''}</div>`; }).join('')}
  </div></div>`;
}

// ── PHOTOS ──
function handlePhotos(input) {
  Array.from(input.files).forEach(f=>{ const r=new FileReader(); r.onload=e=>{ sPhotos.push(e.target.result); const img=document.createElement('img'); img.src=e.target.result; img.className='photo-thumb'; document.getElementById('photos-preview').appendChild(img); }; r.readAsDataURL(f); });
}

// ── SAVE ──
async function saveSession() {
  CS.notes=document.getElementById('recap-notes').value;
  CS.photos=sPhotos;
  await dbPut(CS); CS=null; await loadHome(); goTo('s-home');
}

// ── DETAIL ──
async function viewSession(id) {
  const s=(await dbAll()).find(x=>x.id===id); if(!s) return;
  viewId=id;
  document.getElementById('detail-title').textContent=s.name||'Séance';
  document.getElementById('detail-date').textContent=fmtDate(s.startTime);
  const vol=Math.round(calcVol(s.exercices));
  const ser=s.exercices.filter(e=>e.type!=='cardio').reduce((t,e)=>t+e.series.length,0);
  let html=`<div class="stats-grid" style="margin-bottom:18px">
    <div class="stat-card"><div class="stat-val">${s.duration?fmtDur(s.duration):'—'}</div><div class="stat-lbl">Durée</div></div>
    <div class="stat-card"><div class="stat-val">${vol||'—'}</div><div class="stat-lbl">kg vol.</div></div>
    <div class="stat-card"><div class="stat-val">${ser}</div><div class="stat-lbl">Séries</div></div>
  </div>`;
  html+=s.exercices.map(buildRecap).join('');
  if(s.photos?.length) html+=`<div class="photos-preview">${s.photos.map(p=>`<img src="${p}" class="photo-thumb">`).join('')}</div>`;
  if(s.notes) html+=`<div class="note-lbl" style="margin-top:14px">Notes</div><div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:14px;line-height:1.6;color:var(--text2)">${s.notes}</div>`;
  document.getElementById('detail-content').innerHTML=html;
  goTo('s-detail');
}

async function deleteSession() {
  if(!viewId) return;
  if(confirm('Supprimer cette séance ?')) { await dbDel(viewId); viewId=null; await loadHome(); goTo('s-home'); }
}

// ── BOOT ──
initDB().then(loadHome);
</script>
</body>
</html>
